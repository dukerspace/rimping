<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>Rimping  Nawarat Bridge pixel logo</title>
  <!-- night sky & water -->
  <rect width="32" height="32" fill="#0a0f1a"/>
  <rect y="24" width="32" height="8" fill="#060a12"/>

  <!-- tower base -->
  <rect x="3" y="18" width="8" height="2" fill="#e8e2d6"/>
  <rect x="4" y="16" width="6" height="2" fill="#f0ebe0"/>

  <!-- pavilion pillars -->
  <rect x="4" y="12" width="1" height="4" fill="#e0dbd0"/>
  <rect x="9" y="12" width="1" height="4" fill="#e0dbd0"/>
  <rect x="3" y="12" width="8" height="1" fill="#f5f0e6"/>
  <rect x="4" y="11" width="6" height="1" fill="#faf6ef"/>

  <!-- upper tower / garuda tier -->
  <rect x="5" y="8" width="4" height="3" fill="#f0ebe0"/>
  <rect x="6" y="9" width="2" height="1" fill="#1a1714"/>
  <rect x="4" y="7" width="6" height="1" fill="#f5f0e6"/>

  <!-- tower cap & spire light -->
  <rect x="6" y="5" width="2" height="2" fill="#ede8dc"/>
  <rect x="7" y="4" width="1" height="1" fill="#ffd54f"/>

  <!-- tower edge lights -->
  <rect x="3" y="18" width="1" height="1" fill="#ffd54f"/>
  <rect x="10" y="18" width="1" height="1" fill="#ffd54f"/>
  <rect x="3" y="12" width="1" height="1" fill="#ffd54f"/>
  <rect x="10" y="12" width="1" height="1" fill="#ffd54f"/>
  <rect x="3" y="7" width="1" height="1" fill="#ffd54f"/>
  <rect x="9" y="7" width="1" height="1" fill="#ffd54f"/>
  <rect x="5" y="5" width="1" height="1" fill="#ffd54f"/>
  <rect x="9" y="5" width="1" height="1" fill="#ffd54f"/>

  <!-- bridge deck -->
  <rect x="12" y="16" width="18" height="2" fill="#e8e2d6"/>
  <rect x="12" y="15" width="18" height="1" fill="#faf6ef"/>

  <!-- bridge pillars -->
  <rect x="14" y="18" width="2" height="6" fill="#d8d2c6"/>
  <rect x="19" y="18" width="2" height="6" fill="#d8d2c6"/>
  <rect x="24" y="18" width="2" height="6" fill="#d8d2c6"/>

  <!-- catenary light strings -->
  <rect x="13" y="13" width="1" height="1" fill="#ffd54f"/>
  <rect x="15" y="12" width="1" height="1" fill="#ffd54f"/>
  <rect x="17" y="11" width="1" height="1" fill="#ffd54f"/>
  <rect x="19" y="11" width="1" height="1" fill="#ffd54f"/>
  <rect x="21" y="12" width="1" height="1" fill="#ffd54f"/>
  <rect x="23" y="13" width="1" height="1" fill="#ffd54f"/>
  <rect x="25" y="12" width="1" height="1" fill="#ffd54f"/>
  <rect x="27" y="11" width="1" height="1" fill="#ffd54f"/>
  <rect x="29" y="12" width="1" height="1" fill="#ffd54f"/>

  <!-- railing lights -->
  <rect x="12" y="14" width="1" height="1" fill="#ffe082"/>
  <rect x="15" y="14" width="1" height="1" fill="#ffe082"/>
  <rect x="18" y="14" width="1" height="1" fill="#ffe082"/>
  <rect x="21" y="14" width="1" height="1" fill="#ffe082"/>
  <rect x="24" y="14" width="1" height="1" fill="#ffe082"/>
  <rect x="27" y="14" width="1" height="1" fill="#ffe082"/>
  <rect x="29" y="14" width="1" height="1" fill="#ffe082"/>

  <!-- water reflections -->
  <rect x="7" y="25" width="1" height="2" fill="#c9a227" opacity="0.7"/>
  <rect x="14" y="26" width="1" height="2" fill="#c9a227" opacity="0.5"/>
  <rect x="19" y="26" width="1" height="2" fill="#c9a227" opacity="0.5"/>
  <rect x="24" y="26" width="1" height="2" fill="#c9a227" opacity="0.5"/>
  <rect x="17" y="25" width="1" height="1" fill="#c9a227" opacity="0.4"/>
  <rect x="21" y="25" width="1" height="1" fill="#c9a227" opacity="0.4"/>
  <rect x="27" y="25" width="1" height="1" fill="#c9a227" opacity="0.4"/>
</svg>
